<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <title>Top Down Game</title>
    <link rel="stylesheet" href="style.css">
  <meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
</head>
<body>
    <div id="gameContainer">
        <div id="gameScreen">
            <canvas id="gameCanvas"></canvas>
            <div id="ui">
                <div id="topBar">
    <div id="coins">🪙 <span id="coinCount">0</span></div>
    
    <!-- ⭐ UI LEVEL (bên trái HP) -->
    <div id="levelDisplay">
        <div id="levelCircle">
            <span id="levelText">1</span>
        </div>
    </div>
    
    <div id="stats">
        <div class="statBar">
            <span>HP</span>
            <div class="barBg"><div id="hpBar" class="barFill"></div></div>
            <span id="hpText">100/100</span>
        </div>
        <div class="statBar">
            <span>MP</span>
            <div class="barBg"><div id="mpBar" class="barFill"></div></div>
            <span id="mpText">100/100</span>
        </div>
        <div class="statBar">
            <span>EXP</span>
            <div class="barBg"><div id="expBar" class="barFill"></div></div>
            <span id="expText">0/100</span>
        </div>
    </div>
                </div>
                <div id="inventoryPanel">
                    <div id="inventoryScroll"><div id="inventoryGrid"></div></div>
                    <div id="inventoryScrollbar"><div id="inventoryScrollThumb"></div></div>
                </div>
                <div id="hotbar">
                    <div class="slot" data-slot="0"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                    <div class="slot" data-slot="1"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                    <div class="slot" data-slot="2"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                    <div class="slot" data-slot="3"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                    <div class="slot" data-slot="4"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                    <div class="slot" data-slot="5"><div class="slotIcon empty"></div><div class="slotCount"></div></div>
                </div>
            </div>
          <!-- ⭐ KHỐI 4D (HYPERCUBE) -->
<div id="hypercube" style="display: none;">
    <div class="cube4d">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>
</div>
        </div>
        
        <!-- NÚT KHO -->
        <div id="inventoryBtn"><div class="btnIcon">🎒</div></div>
        
        <!-- NÚT TALK (ẩn mặc định) -->
        <!-- NÚT TALK (ẩn mặc định) -->
<div id="talkBtn" style="display: none;">
    <div class="btnIcon">💬</div>
</div>

<!-- 🟣 NÚT TƯƠNG TÁC ORB DECADE -->
<div id="orbDecadeBtn" style="display: none;">
    <div class="btnIcon">🟣</div>
    <div class="orbText">ORB DECADE</div>
</div>
        
        <!-- JOYSTICK -->
        <div id="joystickArea"><div id="joystickBase"><div id="joystickKnob"></div></div></div>
        <div id="fireJoystickArea"><div id="fireJoystickBase"><div id="fireJoystickKnob"></div><div id="directionIndicator"></div></div></div>
        
        <!-- SHOP PANEL -->
<div id="shopPanel">
    <div id="shopHeader">
        <span>🏪 CỬA HÀNG</span>
        <div id="shopClose">✕</div>
    </div>
    <div id="shopCoins">💰 <span id="shopCoinCount">0</span></div>
    
    <!-- ⭐ TABS -->
    <div id="shopTabs">
        <div class="shopTab active" data-tab="buy">🛒 MUA</div>
        <div class="shopTab" data-tab="sell">💰 BÁN</div>
    </div>
    
    <div id="shopScroll">
        <div id="shopContent"></div>
    </div>
    <div id="shopScrollbar">
        <div id="shopScrollThumb"></div>
    </div>
</div>
      <!-- ⭐ SMITH PANEL -->
<div id="smithPanel">
    <div id="smithHeader">
        <span>⚒️ THỢ RÈN</span>
        <div id="smithClose">✕</div>
    </div>
    <div id="smithBtoken">💠 <span id="smithBtokenCount">0</span></div>
    
    <!-- ⭐ TABS -->
    <div id="smithTabs">
        <div class="smithTab active" data-tab="forge">⚒️ RÈN</div>
        <div class="smithTab" data-tab="craft">🔨 CHẾ TẠO</div>
    </div>
    
    <div id="smithContent">
        <!-- Hiện ở đây -->
    </div>
    <div id="smithActions">
        <button id="smithForgeBtn">⚒️ RÈN</button>
    </div>
</div>
    </div>
    
<script src="js/game.js"></script>
<script src="js/game2.js"></script>
<script src="js/game3.js"></script>
<script src="js/game4.js"></script>
<script src="js/gamebullets.js"></script>
<script src="js/gameitems.js"></script>
<script src="js/gameboss.js"></script>
<script src="js/gamenpc.js"></script>
<script src="js/gamedrawcreate.js"></script>
<script src="js/gamechecker.js"></script>
</body>
</html>
